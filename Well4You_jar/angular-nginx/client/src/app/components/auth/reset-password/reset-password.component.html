<div class="container">
    <div class="section">
        <div class="reset-password-container">
            <div class="logo">
                <img src="assets/home/logo-well4you.png" alt="logoImage">
            </div>
            <h1>Reset Password</h1>
            <form [formGroup]="resetPasswordForm" class="main-form" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <input type="text" id="otp" formControlName="otp" placeholder="OTP code">
                    <div class="error-container">
                        <small appErrorMsgForms [formGroup]="resetPasswordForm" [fields]="['otp']" class="error-message"></small>
                    </div>
                </div>
                <div class="form-group">
                    <input type="password" id="password" formControlName="password" placeholder="Password">
                    <div class="error-container">
                        <small appErrorMsgForms [formGroup]="resetPasswordForm" [fields]="['password']" class="error-message"></small>
                    </div>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirm Password">
                    <div class="error-container">
                        <small appErrorMsgForms [formGroup]="resetPasswordForm" [fields]="['confirmPassword']" class="error-message"></small>
                        <small appErrorMessageApi class="error-message"></small>
                    </div>
                </div>
                <a (click)="resendOtp()">resend new OTP code?</a>
                <button class="btn-send" type="submit" [disabled]="resetPasswordForm.invalid">Send</button>
            </form>
        </div>
    </div>
</div>
