spring.application.name=services-service

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.root=INFO

spring.datasource.url=jdbc:postgresql://${SERVICESSERVICE_POSTGRES_HOST:localhost}:${POSTGRES_PORT:5436}/${POSTGRES_DB:well4you}
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:1234}

spring.jpa.properties.hibernate.default_schema=servicesservice
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.sql.init.mode=always

server.address=0.0.0.0
server.port=${SERVICES_SERVICE_PORT:8084}

user.service.name=${USER_SERVICE_NAME:localhost}
user.service.port=${USER_SERVICE_PORT:8089}

shop.service.name=${SHOP_SERVICE_NAME:localhost}
shop.service.port=${SHOP_SERVICE_PORT:8088}

image.service.name=${IMAGE_SERVICE_NAME:localhost}
image.service.port=${IMAGE_SERVICE_PORT:8083}

like.service.name=${LIKE_SERVICE_NAME:localhost}
like.service.port=${LIKE_SERVICE_PORT:8086}

comment.service.name=${COMMENT_SERVICE_NAME:localhost}
comment.service.port=${COMMENT_SERVICE_PORT:8087}

notification.service.name=${NOTIFICATION_SERVICE_NAME:localhost}
notification.service.port=${NOTIFICATION_SERVICE_PORT:8082}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
