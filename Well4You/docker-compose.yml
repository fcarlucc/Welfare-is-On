services:
  admin:
    container_name: adminer
    image: adminer
    restart: always
    depends_on:
      - postgres-apigateway
      - postgres-otpservice
      - postgres-notificationservice
      - postgres-imageservice
      - postgres-servicesservice
      - postgres-coachservice
      - postgres-likeservice
      - postgres-commentservice
      - postgres-userservice
      - postgres-scheduleservice
    ports:
      - 8080:8080

  angular-nginx:
    container_name: angular-nginx
    build:
      context: angular-nginx
      dockerfile: Dockerfile
      args:
        SERVER_IP: $SERVER_IP
        APIGATEWAY_SERVER_PORT: $APIGATEWAY_SERVER_PORT
        SERVER_PROT: $SERVER_PROT
        CERT_FILE: $CERT_FILE
        KEY_FILE: $KEY_FILE
        CERTS_: $CERTS_
        KEYS_: $KEYS_
    env_file: .env
    ports:
      - "$CLIENT_PORT:$CLIENT_PORT"
    restart: on-failure

  postgres-apigateway:
    image: postgres:alpine
    container_name: postgres-apigateway
    env_file: .env
    volumes:
      - postgres-apigateway-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-otpservice:
    image: postgres:alpine
    container_name: postgres-otpservice
    env_file: .env
    volumes:
      - postgres-otpservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-notificationservice:
    image: postgres:alpine
    container_name: postgres-notificationservice
    env_file: .env
    volumes:
      - postgres-notificationservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-imageservice:
    image: postgres:alpine
    container_name: postgres-imageservice
    env_file: .env
    volumes:
      - postgres-imageservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-servicesservice:
    image: postgres:alpine
    container_name: postgres-servicesservice
    env_file: .env
    volumes:
      - postgres-servicesservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-coachservice:
    image: postgres:alpine
    container_name: postgres-coachservice
    env_file: .env
    volumes:
      - postgres-coachservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-likeservice:
    image: postgres:alpine
    container_name: postgres-likeservice
    env_file: .env
    volumes:
      - postgres-likeservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-commentservice:
    image: postgres:alpine
    container_name: postgres-commentservice
    env_file: .env
    volumes:
      - postgres-commentservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-shopservice:
    image: postgres:alpine
    container_name: postgres-shopservice
    env_file: .env
    volumes:
      - postgres-shopservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-userservice:
    image: postgres:alpine
    container_name: postgres-userservice
    env_file: .env
    volumes:
      - postgres-userservice-vol:/var/lib/postgresql/data
    restart: unless-stopped
    expose:
      - "$POSTGRES_PORT"

  postgres-scheduleservice:
    image: postgres:alpine
    container_name: postgres-scheduleservice
    env_file: .env
    volumes:
