  api-gateway:
    container_name: api-gateway
    depends_on:
      - postgres-apigateway
    build:
      context: microservices/api-gateway
      dockerfile: Dockerfile
    env_file: .env
    restart: on-failure
    ports:
      - "$APIGATEWAY_SERVER_PORT:$APIGATEWAY_SERVER_PORT"

  otp-service:
    container_name: otp-service
    depends_on:
      - postgres-otpservice
    build:
      context: microservices/otp-service
