<div class="container">
    <div class="section">
        <div class="create-event-container">
            <div class="logo">
                <img src="assets/home/logo-well4you.png" alt="logoImage">
            </div>
            <h1>Create Service</h1>
            <form [formGroup]="createServiceForm" class="main-form" (ngSubmit)="onSubmit()">
                <div class="form-columns"> 
                    <div class="form-group">
                        <select id="category" formControlName="category">
                            <option value="" disabled selected>Select Category</option>
                            <option value="PHYSICAL">Physical</option>
                            <option value="ECONOMIC">Economic</option>
                            <option value="PSYCHOLOGICAL">Psychological</option>
                            <option value="FAMILY">Family</option>
                        </select>
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['category']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" id="title" formControlName="title" placeholder="Event Title">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['title']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="number" id="price" formControlName="price" placeholder="Service Price">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['price']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="number" id="discount" formControlName="discount" placeholder="Service Discount">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['discount']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input id="location" formControlName="location" placeholder="Event location">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['location']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <textarea id="description" formControlName="description" placeholder="Event Description"></textarea>
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['description']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input id="url" formControlName="url" placeholder="Application Link">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['url']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="choose-img">
                        <input type="file" id="image" formControlName="image" (change)="onFileChange($event)">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="createServiceForm" [fields]="['image']" class="error-message"></small>
                        </div>
                    </div>
                </div>
                <!-- <div class="form-group map-container">
                    <button type="button" class="btn-map" (click)="isVisible()">Add Location</button>
                    @if (showMap) {
                        <iframe id="mapFrame" src="https://storage.googleapis.com/maps-solutions-fziagwt0uk/address-selection/f7e9/address-selection.html"
                            width="600px" height="550px"
                            loading="lazy">
                        </iframe>
                        // <app-location></app-location>
                    }
                </div> -->
                <button class="btn-create-event" type="submit" [disabled]="createServiceForm.invalid">Create Event</button>
                <button class="btn-cancel" type="button" (click)="navigateTo('dashboard')">Cancel</button>
            </form>
        </div>
    </div>
</div>
