spring.application.name=image-service

spring.datasource.url=jdbc:postgresql://${IMAGESERVICE_POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:well4you}
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:1234}

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

spring.jpa.properties.hibernate.default_schema=imageservice
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.sql.init.mode=always

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

upload.dir=${UPLOAD_DIR:/Users/alessiolongo/Desktop/WelfareIsOnLeonardo/microservices/image-service/server/src/main/resources/uploads}

server.address=0.0.0.0
server.port=${IMAGE_SERVICE_PORT:8083}
