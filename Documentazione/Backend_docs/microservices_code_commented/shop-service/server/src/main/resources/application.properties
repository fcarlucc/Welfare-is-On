spring.application.name=shop-service

spring.datasource.url=jdbc:postgresql://${SHOPSERVICE_POSTGRES_HOST:localhost}:${POSTGRES_PORT:5440}/${POSTGRES_DB:well4you}
spring.datasource.username=${POSTGRES_USER:user}
spring.datasource.password=${POSTGRES_PASSWORD:1234}

logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

spring.jpa.properties.hibernate.default_schema=shopservice
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.sql.init.mode=always

server.address=0.0.0.0
server.port=${SHOP_SERVICE_PORT:8088}

notification.service.name=${NOTIFICATION_SERVICE_NAME:localhost}
notification.service.port=${NOTIFICATION_SERVICE_PORT:8082}

user.service.name=${USER_SERVICE_NAME:localhost}
user.service.port=${USER_SERVICE_PORT:8089}

services.service.name=${SERVICES_SERVICE_NAME:localhost}
services.service.port=${SERVICES_SERVICE_PORT:8084}
