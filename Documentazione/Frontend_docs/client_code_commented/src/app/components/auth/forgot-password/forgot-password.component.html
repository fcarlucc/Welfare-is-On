<div class="container"> 
    <div class="section">
        <div class="forgot-password-container">
            <div class="logo">
                <img src="assets/home/logo-well4you.png" alt="logoImage">
            </div>
            <h1>Forgot Password</h1>
            <form [formGroup]="forgotPasswordForm" class="main-form" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <input type="email" id="email" formControlName="email" placeholder="Email">
                    <div class="error-container">
                        <small appErrorMsgForms [formGroup]="forgotPasswordForm" [fields]="['email']" class="error-message"></small>
                        <small appErrorMessageApi class="error-message"></small>
                    </div>
                </div>
                <button class="btn-send" type="submit" [disabled]="forgotPasswordForm.invalid">Send</button>
            </form>
        </div>
    </div>
</div>
