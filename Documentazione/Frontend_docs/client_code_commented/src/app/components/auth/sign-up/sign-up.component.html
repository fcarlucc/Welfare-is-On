<div class="container">
    <div class="section">
        <div class="signup-container">
            <div class="logo">
                <img src="assets/home/logo-well4you.png" alt="logoImage">
            </div>
            <h1>Sign Up</h1>
            <form [formGroup]="signUpForm" class="main-form" (ngSubmit)="onSubmit()">
                <div class="form-columns">
                    <div class="form-group">
                        <input type="text" id="firstName" formControlName="firstName" placeholder="First Name">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="signUpForm" [fields]="['firstName']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="text" id="lastName" formControlName="lastName" placeholder="Last Name">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="signUpForm" [fields]="['lastName']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" formControlName="email" placeholder="Email">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="signUpForm" [fields]="['email']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="date" id="dob" formControlName="dob" placeholder="Date of birth">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="signUpForm" [fields]="['dob']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" formControlName="password" placeholder="Password">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="signUpForm" [fields]="['password']" class="error-message"></small>
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirm Password">
                        <div class="error-container">
                            <small appErrorMsgForms [formGroup]="signUpForm" [fields]="['confirmPassword']" class="error-message"></small>
                        </div>
                    </div>
                </div>
                <button class="btn-signup" type="submit" [disabled]="signUpForm.invalid">Sign Up</button>
                <button class="btn-signin" type="button" (click)="navigateTo('sign-in')">Sign In</button>
            </form>
        </div>
    </div>
</div>
