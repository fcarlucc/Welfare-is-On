<div class="container">
	<div class="section">
		<div class="daily-availability-container">
			<div class="logo">
				<img src="assets/home/logo-well4you.png" alt="logoImage">
			</div>
			<h1>Daily Availability</h1>
			<form [formGroup]="dailyAvailabilityForm" class="main-form" (ngSubmit)="onSubmit()">
				<div class="form-columns">
					<div class="form-group">
						<input type="date" id="callDate" formControlName="callDate" (change)="onDateChange($event)">
						<div class="error-container">
							<small appErrorMsgForms [formGroup]="dailyAvailabilityForm" [fields]="['callDate']" class="error-message"></small>
						</div>
					</div>
					@if (showTimeSlots) {
					<div class="form-group">
						<label for="timeSlots">Select Time Slots</label>
						<select id="timeSlots" formControlName="timeSlots" multiple>
						<option *ngFor="let slot of this.timeSlots" [ngValue]="slot"
						(click)="toggleSlot(slot)"
						[class.selected]="isSelected(slot)"
						[class.booked]="isBookedSlot(slot)">
						{{ slot.startTime | date: 'HH:mm' }} - {{ slot.endTime | date: 'HH:mm' }}</option>
						</select>
					</div>
					}
				</div>
				<button class="btn-daily-availability" type="submit" [disabled]="dailyAvailabilityForm.invalid">Save Availability</button>
				<button class="btn-cancel" type="button" (click)="navigateTo('')">Cancel</button>
			</form>
		</div>
	</div>
</div>
